<!DOCTYPE html>
<html>
  <head><title>rock paper scissors</title></head>
  <body>
    <link rel="stylesheet" href="styles/10-rock-paper-scissor.css">
    <p class="title">Rock Paper Scissor</p>

    <button onclick="
    playgame('rock');
    " class="move-button">
    <img src="Rock Paper Scissors_files/rock-emoji.png" class="move-icon">
    </button>

    <button onclick="
    playgame('paper');
    " class="move-button">
    <img src="Rock Paper Scissors_files/paper-emoji.png" class="move-icon">
    </button>

    <button onclick="
    playgame('scissors');
    " class="move-button">
    <img src="Rock Paper Scissors_files/scissors-emoji.png" class="move-icon">
    </button>

  <p class="js-result result"> </p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

    <button onclick="
    score.wins =0;
    score.losses=0;
    score.tie=0;
    localStorage.removeItem('score');
    updateScore();
    " class="reset-score">reset score</button>
    
    <script src="10-rocj-paper-scissor.js"></script>

      </body>
</html>
